# Ambiente de desenvolvimento do Grello.
# Uso: docker compose up -d --build  ->  http://localhost:8000
#
# O Compose lê automaticamente o .env da raiz para interpolar as variáveis ${...}.
# A senha do banco usa a mesma expressão em "db" e "web" para que nunca divirjam.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestao_tarefas}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # O postgres:18 usa PGDATA=/var/lib/postgresql/18/docker; monta-se o diretório pai.
      - pgdata:/var/lib/postgresql
    ports:
      # 5433 no host para não conflitar com um PostgreSQL local.
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-gestao_tarefas}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
