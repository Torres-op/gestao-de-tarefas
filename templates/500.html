<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erro interno &middot; Grello</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f5f9;
        color: #1b2333;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }

      main {
        max-width: 520px;
        margin: 20px;
        padding: 32px 28px;
        background: #ffffff;
        border: 1px solid #e3e7f0;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(27, 35, 51, 0.06), 0 4px 14px rgba(27, 35, 51, 0.05);
        text-align: center;
      }

      .brand {
        margin: 0 0 18px;
        font-weight: 600;
        color: #6b7690;
      }

      .code {
        margin: 0;
        font-size: 3rem;
        font-weight: 700;
        line-height: 1;
        color: #3b5bdb;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 0 0 18px;
      }

      a {
        display: inline-block;
        padding: 8px 15px;
        border-radius: 8px;
        background: #3b5bdb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Grello</p>
      <p class="code">500</p>
      <h1>Algo deu errado do nosso lado</h1>
      <p>Ocorreu um erro inesperado ao processar a sua solicitação. Tente novamente em alguns instantes.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
