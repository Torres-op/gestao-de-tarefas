{% with state=sprint.state %}
    {% if state == "active" %}
        <span class="badge badge-info">{{ sprint.state_label }}</span>
    {% elif state == "finished" %}
        <span class="badge badge-neutral">{{ sprint.state_label }}</span>
    {% else %}
        <span class="badge badge-warning">{{ sprint.state_label }}</span>
    {% endif %}
{% endwith %}
